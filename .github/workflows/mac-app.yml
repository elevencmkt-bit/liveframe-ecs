# LiveFrame.app + LiveFrame.dmg on a GitHub macOS runner (Apple Silicon) — MANUAL ONLY.
#
# The account has no paid Actions minutes, and macOS runners cost money on a private repo, so the
# macOS build never starts by itself: the .dmg is built on Levi's Mac with "Montar LiveFrame.command"
# (double-click in the repo folder). Pull requests and pushes to main only run the Linux tests (free).
#
# If macOS minutes are ever enabled: Actions → Mac app → Run workflow. Run it on a tag (v2.0.1, ...)
# and the .dmg is also published as LiveFrame.dmg in a GitHub Release of that tag.
#
# Signing/notarization is optional and switches on by itself when these repository secrets exist:
#   MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD   Developer ID Application certificate (.p12, base64)
#   MACOS_SIGN_IDENTITY                          e.g. "Developer ID Application: Fermiano Group LLC (TEAMID)"
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD  notarytool credentials (app-specific password)
# Without them the app is ad-hoc signed (needed on Apple Silicon) and must be allowed once in
# System Settings → Privacy & Security.
name: Mac app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mac-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python -m unittest discover -s tests -v
        env:
          LIVEFRAME_SECRETS: file

  build:
    if: github.event_name == 'workflow_dispatch'   # macOS minutes are paid: never automatic
    runs-on: macos-14   # Apple Silicon (arm64)
    timeout-minutes: 40
    env:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            # the tag is the source of truth: stamp it into the app
            sed -i '' -E "s/^__version__ = \".*\"/__version__ = \"${VERSION}\"/" liveframe/__init__.py
            RELEASE=true
          else
            VERSION=$(python -c 'import re;print(re.search(r"__version__ = \"([^\"]+)\"",open("liveframe/__init__.py").read()).group(1))')
            RELEASE=false
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "LiveFrame $VERSION (release: $RELEASE)"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r packaging/requirements-build.txt
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg   # only for the unit tests

      - name: Unit tests
        env:
          LIVEFRAME_SECRETS: file
        run: python -m unittest discover -s tests -v

      - name: Icon and DMG art
        run: python packaging/make_art.py build/art

      - name: Build LiveFrame.app
        run: pyinstaller --noconfirm --clean --distpath dist --workpath build/pyi packaging/LiveFrame.spec

      - name: Sign (Developer ID if configured, else ad-hoc)
        run: |
          APP=dist/LiveFrame.app
          if [[ -n "$MACOS_CERT_P12_BASE64" && -n "$MACOS_SIGN_IDENTITY" ]]; then
            KC="$RUNNER_TEMP/build.keychain-db"; KCP=$(uuidgen)
            echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$KCP" "$KC"
            security set-keychain-settings -lut 21600 "$KC"
            security unlock-keychain -p "$KCP" "$KC"
            security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
            security set-key-partition-list -S apple-tool:,apple: -k "$KCP" "$KC" >/dev/null
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
            rm -f "$RUNNER_TEMP/cert.p12"
            codesign --force --deep --timestamp --options runtime \
              --entitlements packaging/entitlements.plist --sign "$MACOS_SIGN_IDENTITY" "$APP"
            echo "SIGNED=developer-id" >> "$GITHUB_ENV"
          else
            codesign --force --deep --sign - "$APP"
            echo "SIGNED=ad-hoc" >> "$GITHUB_ENV"
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Self-test the packaged app
        run: |
          dist/LiveFrame.app/Contents/MacOS/LiveFrame --version
          # a short PATH like the Finder's: proves the bundled ffmpeg is the one used
          env -i HOME="$HOME" PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            dist/LiveFrame.app/Contents/MacOS/LiveFrame --selftest
          lipo -archs dist/LiveFrame.app/Contents/MacOS/LiveFrame
          du -sh dist/LiveFrame.app

      - name: Build LiveFrame.dmg
        run: |
          dmgbuild -s packaging/dmg_settings.py -D app=dist/LiveFrame.app -D art=build/art \
            "LiveFrame ${{ steps.version.outputs.version }}" dist/LiveFrame.dmg
          if [[ "$SIGNED" == developer-id ]]; then
            codesign --force --timestamp --sign "$MACOS_SIGN_IDENTITY" dist/LiveFrame.dmg
          fi
          hdiutil verify dist/LiveFrame.dmg
          ls -la dist/LiveFrame.dmg

      - name: Notarize (only with the Apple secrets)
        if: env.SIGNED == 'developer-id' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PASSWORD != ''
        run: |
          xcrun notarytool submit dist/LiveFrame.dmg --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/LiveFrame.dmg

      - name: Check the DMG mounts and holds the app
        run: |
          MNT=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" dist/LiveFrame.dmg
          ls -la "$MNT"
          test -d "$MNT/LiveFrame.app" && test -L "$MNT/Applications"
          "$MNT/LiveFrame.app/Contents/MacOS/LiveFrame" --version
          hdiutil detach "$MNT"

      - uses: actions/upload-artifact@v4
        with:
          name: LiveFrame-${{ steps.version.outputs.version }}-dmg
          path: dist/LiveFrame.dmg
          retention-days: 30

  release:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LiveFrame-${{ needs.build.outputs.version }}-dmg
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          TAG="v${VERSION}"
          NOTES="LiveFrame ${VERSION} for Mac (Apple Silicon). Download LiveFrame.dmg, open it and drag LiveFrame to Applications. Not signed by Apple yet: the first time, allow it in System Settings → Privacy & Security → Open Anyway."
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/LiveFrame.dmg --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/LiveFrame.dmg -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "LiveFrame ${VERSION}" --notes "$NOTES"
          fi
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/LiveFrame.dmg"
